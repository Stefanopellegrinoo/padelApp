*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dbdf;font-family:Hanken,system-ui,sans-serif;color:#111;padding:20px}
header.top{max-width:760px;margin:0 auto 18px}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
header.top p{font-size:15px;color:#3d424a;margin-top:6px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;max-width:760px;margin:0 auto}
figure{display:flex;flex-direction:column;gap:8px}
figcaption{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#1d2026}
figcaption b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1d2026;color:#fff;font-size:15px}
.s{overflow:hidden}
.s ol{list-style:none}
.s li{display:flex;align-items:center;gap:10px}
.s .p{display:inline-flex;width:22px;opacity:.9}
.s .n{flex:1}
.s .n em{font-style:normal;font-size:.8em;margin-left:4px}
.s .pts{display:inline-flex;font-variant-numeric:tabular-nums}
.s .match p{display:flex;justify-content:space-between;align-items:center}
.s .cta{display:block;text-align:center}

.t1.s{background:#fff;color:#111;font-family:Hanken;padding:22px;border:1px solid #e6e6e6}
.t1 .tname{font-size:20px;font-weight:700}
.t1 .sub{color:#777;font-size:13px;margin-bottom:12px}
.t1 .rows li{padding:9px 0;border-bottom:1px solid #eee;font-size:15px}
.t1 .pts{font-weight:700}
.t1 .rows li.me{color:#0b5cd5;font-weight:700}
.t1 .rows li.me em{color:#999;font-weight:400}
.t1 .match{margin:16px 0;font-size:15px}
.t1 .match p{padding:4px 0}
.t1 .w{font-weight:700}
.t1 .l{color:#888}
.t1 .cta{background:#111;color:#fff;border-radius:12px;padding:13px;font-weight:600}

.t2.s{background:#121417;color:#eef0f3;font-family:Onest;padding:22px;border-radius:20px}
.t2 .tname{font-size:20px;font-weight:600}
.t2 .sub{color:#8a919c;font-size:13px;margin-bottom:12px}
.t2 .rows li{padding:10px 12px;border-radius:10px;font-size:15px}
.t2 .pts{font-weight:600}
.t2 .rows li.me{background:#1f2630;color:#8fb8ff}
.t2 .rows li.me em{color:#6b7480}
.t2 .match{margin:14px 0;background:#1a1d22;border-radius:14px;padding:12px 14px}
.t2 .w{font-weight:600}
.t2 .l{color:#7b828c}
.t2 .match p{padding:4px 0}
.t2 .cta{background:#eef0f3;color:#121417;border-radius:12px;padding:13px;font-weight:600}

.t3.s{background:#0a4fd6;color:#fff;font-family:Schibsted;padding:22px;border-radius:24px}
.t3 .tname{font-size:22px;font-weight:800}
.t3 .sub{color:#c9dbff;font-size:13px;margin-bottom:12px}
.t3 .rows li{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:15px}
.t3 .pts{font-weight:800}
.t3 .rows li.me{color:#ffe14d}
.t3 .rows li.me em{color:#c9dbff}
.t3 .match{margin:14px 0;background:#fff;color:#0a2a66;border-radius:16px;padding:12px 14px}
.t3 .w{font-weight:800}
.t3 .l{color:#5b6b8c}
.t3 .match p{padding:4px 0}
.t3 .cta{background:#ffe14d;color:#0a2a66;border-radius:999px;padding:13px;font-weight:800}

.t4.s{background:linear-gradient(150deg,#5b2be0,#1f7fe8 60%,#14c3c3);color:#fff;font-family:Onest;padding:22px;border-radius:24px}

.t4 .sub{color:#dbe6ff;font-size:13px;margin-bottom:12px}

.t5.s{background:radial-gradient(circle at 20% 10%,#7fd1ff,#3b6cf0 45%,#1a2d6b);color:#fff;font-family:Hanken;padding:18px;border-radius:24px}

.t5 .rows li:last-child{border:0}

.t5 .rows li.me{font-weight:700}
.t5 .rows li.me em{color:#e3ecff}

.t6.s{background:#e9ebef;color:#151a24;font-family:BarlowC;padding:20px}
