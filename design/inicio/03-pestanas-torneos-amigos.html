<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Pestañas Torneos y Amigos</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f4f6f3; --chip: #eaefea; --line: #e4e9e5;
    --text: #10231a; --muted: #5f6e66; --accent: #0e5c3f; --accent-text: #ffffff;
    --accent-link: #0e5c3f; --up: #27794e; --ok-bg: #e6f2ea; --down: #b24b31;
    --r-field: 12px; --r-card: 16px; --stage: #eef1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1512; --surface: #16201c; --chip: #1b2823; --line: #21302a;
      --text: #eaf2ee; --muted: #8ea298; --accent: #0f6b48; --accent-text: #dbf5e8;
      --accent-link: #34c08a; --up: #34c08a; --ok-bg: #12291f; --down: #ff9a6b; --stage: #08100d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--stage); color: var(--text); font-family: Archivo, ui-sans-serif, system-ui, sans-serif; width: 1290px; padding: 32px; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent-link); outline-offset: 2px; border-radius: 6px; }
  .stage { display: flex; gap: 32px; align-items: flex-start; }
  figure { width: 390px; }
  figcaption { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
  figcaption b { color: var(--text); }
  .phone { background: var(--bg); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; height: 760px; display: flex; flex-direction: column; }
  .screen { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 20px 20px; overflow: hidden; }
  header { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; }
  .kicker { font-size: 13px; font-weight: 650; color: var(--muted); }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .me { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 800; border: 0; font-family: inherit; }
  .micro { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .13em; color: var(--muted); }
  .card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .name { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .sport { font-size: 12.5px; font-weight: 650; color: var(--muted); margin-top: 2px; }
  .pill { border-radius: 999px; background: var(--ok-bg); color: var(--up); padding: 6px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .facts { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
  .val { font-size: 15px; font-weight: 800; }
  .vline { width: 1px; height: 26px; background: var(--line); }
  .btn { display: block; border-radius: var(--r-field); padding: 16px; text-align: center; font-size: 15px; font-weight: 800; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .secondary { border: 1px solid var(--line); }
  .list { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
  .li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; min-height: 64px; }
  .li + .li { border-top: 1px solid var(--line); }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--ok-bg); color: var(--up); flex-shrink: 0; }
  .li b { display: block; font-size: 15px; font-weight: 700; }
  .sub { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .rk { margin-left: auto; text-align: right; }
  .rk strong { display: block; font-size: 17px; font-weight: 800; }
  .rk span { font-size: 11px; font-weight: 700; color: var(--muted); }
  .w { color: var(--up); font-weight: 800; }
  .l { color: var(--down); font-weight: 800; }
  .table { border: 1px solid var(--line); border-radius: var(--r-card); }
  .tr { display: grid; grid-template-columns: 28px 1fr 44px; gap: 8px; align-items: center; padding: 11px 14px; font-size: 14.5px; font-weight: 700; }
  .tr + .tr { border-top: 1px solid var(--line); }
  .tr .p { font-weight: 800; color: var(--muted); }
  .tr .pts { text-align: right; font-weight: 800; }
  .tr.me-row { background: var(--ok-bg); }
  .chips { display: flex; gap: 8px; }
  .chip { border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 800; background: var(--chip); color: var(--muted); }
  .chip.on { background: var(--text); color: var(--bg); }
  nav { display: flex; border-top: 1px solid var(--line); padding: 8px 22px 18px; background: var(--bg); }
  nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; justify-content: center; color: var(--muted); font-size: 12px; font-weight: 800; }
  nav a.on { color: var(--accent-link); }
  nav svg { width: 22px; height: 22px; }
  .back { font-size: 14px; font-weight: 800; color: var(--accent-link); padding-top: 14px; }
  .note { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
<div class="stage">

<figure>
  <figcaption><b>Pestaña Torneos</b> · la pantalla de entrada</figcaption>
  <div class="phone">
    <div class="screen">
      <header><h1>Torneos</h1><button class="me" aria-label="Tu cuenta">MP</button></header>
      <a class="card" href="#">
        <div class="top"><div><p class="name">Los Pibes del Martes</p><p class="sport">Pádel · Fecha 7 de 12</p></div><span class="pill">En juego</span></div>
        <div class="facts"><div><p class="micro">Mi posición</p><p class="val">3° de 12</p></div><span class="vline"></span><div><p class="micro">Próxima fecha</p><p class="val">Mar 18/11</p></div></div>
      </a>
      <a class="card" href="#">
        <div class="top"><div><p class="name">FIFA de los Viernes</p><p class="sport">FIFA · Fecha 4 de 8</p></div><span class="pill">En juego</span></div>
        <div class="facts"><div><p class="micro">Mi posición</p><p class="val">1° de 6</p></div><span class="vline"></span><div><p class="micro">Próxima fecha</p><p class="val">Vie 21/11</p></div></div>
      </a>
      <a class="btn primary" href="#">Crear torneo</a>
      <a class="btn secondary" href="#">Armar un torneo rápido</a>
    </div>
    <nav aria-label="Navegación de la app">
      <a class="on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Torneos</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Amigos</a>
    </nav>
  </div>
</figure>

<figure>
  <figcaption><b>Pestaña Amigos</b> · al mismo nivel que Torneos</figcaption>
  <div class="phone">
    <div class="screen">
      <header><h1>Amigos</h1><button class="me" aria-label="Tu cuenta">MP</button></header>
      <div class="list">
        <a class="li" href="#"><span class="av">NA</span><span><b>Nico Arias</b><span class="sub"><span class="w">Ganaste 6-4 6-3</span> · hace 2 días</span></span><span class="rk"><strong>7–5</strong><span>historial</span></span></a>
        <a class="li" href="#"><span class="av">FG</span><span><b>Facu Gómez</b><span class="sub"><span class="l">Perdiste 1-3</span> · el viernes</span></span><span class="rk"><strong>4–6</strong><span>historial</span></span></a>
        <a class="li" href="#"><span class="av">JL</span><span><b>Juampi Ledesma</b><span class="sub"><span class="w">Ganaste 6-2 7-5</span> · hace 1 semana</span></span><span class="rk"><strong>3–1</strong><span>historial</span></span></a>
        <a class="li" href="#"><span class="av">SR</span><span><b>Seba Ruiz</b><span class="sub">Todavía no jugaron</span></span><span class="rk"><strong>—</strong></span></a>
      </div>
      <a class="btn primary" href="#">Cargar un partido</a>
      <a class="btn secondary" href="#">Agregar un amigo</a>
    </div>
    <nav aria-label="Navegación de la app">
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Torneos</a>
      <a class="on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Amigos</a>
    </nav>
  </div>
</figure>

<figure>
  <figcaption><b>Adentro de un torneo</b> · la barra cambia</figcaption>
  <div class="phone">
    <div class="screen">
      <a class="back" href="#">‹ Torneos</a>
      <div><p class="kicker">Pádel · Fecha 7 de 12</p><h1>Los Pibes del Martes</h1></div>
      <div class="table" role="table" aria-label="Tabla">
        <div class="tr" role="row"><span class="p">1</span><span>Nico Arias</span><span class="pts">58</span></div>
        <div class="tr" role="row"><span class="p">2</span><span>Lucas Ferro</span><span class="pts">54</span></div>
        <div class="tr me-row" role="row"><span class="p">3</span><span>Martín (vos)</span><span class="pts">51</span></div>
        <div class="tr" role="row"><span class="p">4</span><span>Juampi Ledesma</span><span class="pts">47</span></div>
        <div class="tr" role="row"><span class="p">5</span><span>Tomi Herrera</span><span class="pts">44</span></div>
        <div class="tr" role="row"><span class="p">6</span><span>Gonza Paz</span><span class="pts">40</span></div>
      </div>
    </div>
    <nav aria-label="Navegación del torneo">
      <a class="on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Tabla</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Fechas</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></svg>Stats</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Reglas</a>
    </nav>
  </div>
  <p class="note">Al entrar a un torneo, la barra Torneos/Amigos se reemplaza por la del torneo. Son dos barras distintas según dónde estés.</p>
</figure>

</div>
</body>
</html>
