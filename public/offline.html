<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1F45E0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1630" />
    <title>Sin conexión · Padel Liga</title>
    <!--
      La paleta es la de `app/globals.css` (claro y oscuro), copiada a mano: esta
      página la guarda `sw.js` sola, sin el CSS de la app. La fuente es la del
      sistema a propósito: Archivo se sirve con un nombre que cambia en cada build
      y no está guardada, así que sin red no llegaría.
    -->
    <style>
      :root {
        --bg: #ffffff; --text: #0e1a4a; --muted: #4b5675;
        --block: #1f45e0; --on-block: #ffffff; --on-block-soft: #c9d3ff;
        --cta: #0e1a4a; --on-cta: #ffffff; --focus: #0e1a4a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1630; --text: #edf0fa; --muted: #a3aecf;
          --block: #2643bc; --cta: #2643bc; --focus: #edf0fa;
        }
      }
      * { box-sizing: border-box; }
      html { color-scheme: light dark; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 32rem; margin: 0 auto; }
      header {
        background: var(--block); color: var(--on-block);
        border-radius: 0 0 24px 24px;
        padding: calc(16px + env(safe-area-inset-top)) 16px 20px;
      }
      .marca { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
      .marca svg { width: 24px; height: 24px; }
      h1 { margin: 40px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
      header p:last-child { margin: 6px 0 0; font-size: 15px; color: var(--on-block-soft); }
      .cuerpo { display: flex; flex-direction: column; gap: 12px; padding: 24px 16px; }
      button {
        min-height: 56px; width: 100%; padding: 0 20px; border: 0; border-radius: 14px;
        background: var(--cta); color: var(--on-cta);
        font: inherit; font-size: 17px; font-weight: 700;
      }
      button:disabled { opacity: 0.45; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      @media (prefers-reduced-motion: no-preference) {
        button { transition: scale 140ms cubic-bezier(0.23, 1, 0.32, 1); }
        button:not(:disabled):active { scale: 0.97; }
      }
      #estado { margin: 0; min-height: 1.5em; font-size: 16px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="marca">
          <!-- La pala de `scripts/icons.py`, en trazo. -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6.2" y="1.6" width="11.6" height="13" rx="5.8" fill="none" stroke="currentColor" stroke-width="1.8" />
            <circle cx="12" cy="5.4" r="1" /><circle cx="9.6" cy="8.1" r="1" /><circle cx="12" cy="8.1" r="1" />
            <circle cx="14.4" cy="8.1" r="1" /><circle cx="12" cy="10.8" r="1" />
            <path d="M10.6 14.4v1.6M13.4 14.4v1.6" stroke="currentColor" stroke-width="1.8" />
            <rect x="10.4" y="16" width="3.2" height="6.6" rx="1.6" />
          </svg>
          Padel Liga
        </p>
        <h1>Sin conexión</h1>
        <p>Cuando vuelva la señal, se recarga sola.</p>
      </header>
      <div class="cuerpo">
        <button type="button" id="reintentar">Reintentar</button>
        <p id="estado" role="status"></p>
      </div>
    </main>
    <script>
      // Antes de recargar se prueba la red con un pedido común (no una
      // navegación, así el worker no lo intercepta): si falla, recargar sólo
      // volvería a dibujar esta misma pantalla y parecería que el botón no hace
      // nada. Cuando vuelve la conexión, se reintenta solo.
      const estado = document.getElementById('estado')
      const boton = document.getElementById('reintentar')
      async function reintentar() {
        boton.disabled = true
        estado.textContent = 'Probando…'
        try {
          await fetch('/manifest.webmanifest', { cache: 'no-store' })
          location.reload()
        } catch {
          estado.textContent = 'Todavía sin conexión.'
          boton.disabled = false
        }
      }
      boton.addEventListener('click', reintentar)
      addEventListener('online', reintentar)
    </script>
  </body>
</html>
