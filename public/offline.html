<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Padel Liga</title>
    <style>
      :root { --bg: #ffffff; --text: #10231a; --muted: #5f6e66; --accent: #0e5c3f; --accent-text: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d1512; --text: #eaf2ee; --muted: #8ea298; --accent: #0f6b48; --accent-text: #dbf5e8; }
      }
      html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 0 24px; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
      p { margin: 0; font-size: 14px; font-weight: 550; color: var(--muted); }
      button {
        margin-top: 16px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
        background: var(--accent); color: var(--accent-text); font: inherit; font-size: 15px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Sin conexión</h1>
    <p>No hay internet. Cuando vuelva la señal, probá de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </body>
</html>
