<!--
  Mail de recuperar contraseña. Es el mismo en local (supabase/config.toml lo
  carga) y en producción, donde se pega a mano en el dashboard: Authentication
  → Emails → Reset Password. Ver docs/despliegue.md.

  El link usa token_hash y no el link por defecto de Supabase: el de Supabase
  sólo anda en el mismo navegador que pidió el mail (app/auth/confirm/route.ts).
-->
<h2>Elegí tu contraseña nueva</h2>
<p>Pediste cambiar la contraseña de tu cuenta de Padel Liga.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Elegir contraseña nueva</a>
</p>
<p>Si no lo pediste vos, ignorá este mail: tu contraseña sigue siendo la misma.</p>
